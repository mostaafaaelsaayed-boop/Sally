    <style>
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #2b0308 0%, #4a0814 50%, #1a0205 100%);

        /* القلوب المتحركة في الخلفية */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart-particle {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 105, 180, 0.6);
            animation: floatUp 8s linear infinite;
            filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.8));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* تصميم القلب في الصفحة الأولى */
        .heart-shape {
            width: 310px;
            height: 300px;
            background: linear-gradient(145deg, #be123c, #881337);
            position: relative;
            transform: rotate(-45deg);
            box-shadow: 0 0 35px rgba(225, 29, 72, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.2);
            border-radius: 20px 20px 0 0;
            margin-top: 50px;
        }

        .heart-shape::before,
        .heart-shape::after {
            content: "";
            width: 310px;
            height: 310px;
            background: linear-gradient(145deg, #be123c, #881337);
            border-radius: 50%;
            position: absolute;
        }

        .heart-shape::before {
            top: -155px;
            left: 0;
        }

        .heart-shape::after {
            left: 155px;
            top: 0;
        }

        .heart-content {
            position: absolute;
            transform: rotate(45deg);
            z-index: 10;
            width: 320px;
            top: -45px;
            left: -5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* كروت بتأثير الزجاج الشفاف */
        .glass-card {
            background: rgba(88, 12, 28, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 182, 193, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 105, 180, 0.15);
            border-radius: 24px;
        }

        /* أزرار مخصصة */
        .custom-btn {
            background: linear-gradient(135deg, #9f1239, #881337);
            border: 1px solid rgba(251, 113, 133, 0.5);
            box-shadow: 0 4px 20px rgba(159, 18, 57, 0.6);
            transition: all 0.3s ease;
        }

        .custom-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 25px rgba(225, 29, 72, 0.8);
        }

        .custom-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* مشغل الصوت الثابت */
        .music-player-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(35, 4, 10, 0.92);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(244, 63, 94, 0.3);
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.7);
        }

        /* شريط تقدم الصوت */
        input[type=range] {
            accent-color: #f43f5e;
        }

        /* الظرف المتحرك */
        .envelope {
            transition: all 0.5s ease-in-out;
            transform-origin: top;
        }

        /* مؤشر الكتابة */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #f43f5e;
            font-weight: bold;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // --- 1. إنشاء القلوب المتحركة ---
        function createHearts() {
            const container = document.getElementById('heartsContainer');
            const heartIcons = ['💖', '💗', '💓', '💕', '❤️', '🌹'];
            for (let i = 0; i < 22; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (Math.random() * 14 + 12) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();

        // --- 2. التحكم في التنقل بين الصفحات ---
        let currentPage = 1;

        function goToPage(pageNum) {
            document.getElementById(`page${currentPage}`).classList.add('hidden');
            document.getElementById(`page${currentPage}`).classList.remove('flex');

            currentPage = pageNum;
            const nextP = document.getElementById(`page${pageNum}`);
            nextP.classList.remove('hidden');
            nextP.classList.add('flex');

            if (pageNum === 2) {
                startTypewriter1();
            } else if (pageNum === 3) {
                startCounter();
            } else if (pageNum === 4) {
                startFinalTypewriter();
            }
        }

        // --- 3. تحقق كلمة السر ---
        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (input === 'sallynor3eny') {
                errorMsg.classList.add('hidden');
                goToPage(2);
            } else {
                errorMsg.innerText = 'كلمة السر غير صحيحة يا قطتي 💔';
                errorMsg.classList.remove('hidden');
            }
        }

        // إمكانية الضغط على Enter لدخول كلمة السر
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // --- 4. تأثير الكتابة التدريجية (الصفحة الثانية) ---
        const text1 = `بخخخخ🌹
بصراحة يعني بصراحة انا قولت اميرة زيك ميكفيهاش موقع واحد وغير كدة انتي مش اي اميرة انتي اميرتيي انا فا عشان كدة عملتلك كمان واحد يافراولتي❤ ملاحظة غير مسموح لحد غيرك ياقطتي يشوف الموقع والكلام دة كله هاا غيير مسموووح ومش لازم احدد🙄.`;

        let isTyped1 = false;
        function startTypewriter1() {
            if (isTyped1) return;
            isTyped1 = true;
            const container = document.getElementById('typewriterText1');
            container.classList.add('typing-cursor');
            let i = 0;
            const speed = 40;

            function type() {
                if (i < text1.length) {
                    container.textContent += text1.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    container.classList.remove('typing-cursor');
                }
            }
            type();
        }

        // --- 5. العداد الزمني (الصفحة الثالثة) ---
        function startCounter() {
            // تاريخ البداية: 3 يوليو 2026
            const startDate = new Date('2026-07-03T00:00:00');

            function updateCounter() {
                const now = new Date();
                const diff = now - startDate;

                if (diff < 0) {
                    document.getElementById('days').innerText = '0';
                    document.getElementById('hours').innerText = '0';
                    document.getElementById('minutes').innerText = '0';
                    document.getElementById('seconds').innerText = '0';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours;
                document.getElementById('minutes').innerText = minutes;
                document.getElementById('seconds').innerText = seconds;
            }

            updateCounter();
            setInterval(updateCounter, 1000);
        }

        // --- 6. فتح الظرف وكتابة الرسالة ---
        const envelopeTextContent = `بحبكك❤

وعد ياقطتي
اني هخليكي تشوفيني ب عيونك الحلوين دول وانا بحاول بكل ما فيا اني اخلي العداد دة يعدلنا سنة ورا سنة ورا سنة لحد ما لا نهاية عشان انا بحبكك يااميرتي👸❤
ومتنسيش ها
All of Disney's princess are fake, but there's one real princess named Sally. 👸❤🌕`;

        let isEnvelopeOpen = false;
        function openEnvelope() {
            const envContainer = document.getElementById('envelopeContainer');
            const envText = document.getElementById('envelopeText');
            const nextBtn3 = document.getElementById('nextBtn3');

            envContainer.classList.remove('hidden');
            envContainer.classList.add('flex');

            if (!isEnvelopeOpen) {
                isEnvelopeOpen = true;
                envText.classList.add('typing-cursor');
                let i = 0;
                const speed = 45;

                function typeEnvelope() {
                    if (i < envelopeTextContent.length) {
                        envText.textContent += envelopeTextContent.charAt(i);
                        i++;
                        setTimeout(typeEnvelope, speed);
                    } else {
                        envText.classList.remove('typing-cursor');
                        nextBtn3.classList.remove('hidden');
                    }
                }
                typeEnvelope();
            }
        }

        // --- 7. الصفحة الأخيرة والكتابة البطيئة ---
        const finalContent = `This was for my Wife , Princess and girl of the girls Sally👸🌕

The end`;

        let isFinalTyped = false;
        function startFinalTypewriter() {
            if (isFinalTyped) return;
            isFinalTyped = true;
            const container = document.getElementById('finalText');
            container.classList.add('typing-cursor');
            let i = 0;
            const speed = 85; // كتابة بطيئة بناءً على الطلب

            function typeFinal() {
                if (i < finalContent.length) {
                    container.textContent += finalContent.charAt(i);
                    i++;
                    setTimeout(typeFinal, speed);
                } else {
                    container.classList.remove('typing-cursor');
                }
            }
            typeFinal();
        }

        // --- 8. مشغل الصوت المخصص ---
        const audio = document.getElementById('mainAudio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const audioSeek = document.getElementById('audioSeek');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        function loadUserAudio(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audio.src = url;
                audio.play();
                playIcon.className = 'fa-solid fa-pause text-xs';
            }
        }

        function togglePlay() {
            if (!audio.src) {
                document.getElementById('audioFileInput').click();
                return;
            }
            if (audio.paused) {
                audio.play();
                playIcon.className = 'fa-solid fa-pause text-xs';
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play text-xs';
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                audioSeek.max = audio.duration;
                audioSeek.value = audio.currentTime;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationTimeEl.innerText = formatTime(audio.duration);
            }
        });

        function seekAudio(val) {
            if (audio.src) {
                audio.currentTime = val;
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
